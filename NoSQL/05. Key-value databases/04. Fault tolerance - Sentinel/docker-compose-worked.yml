services:
  redis-master:
    image: bitnami/redis:latest
    container_name: redis-master
    hostname: redis-master
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - 6379:6379
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - redis-net
    restart: unless-stopped

  redis-replica-1:
    image: bitnami/redis:latest
    container_name: redis-replica-1
    hostname: redis-replica-1
    environment:
      - REDIS_REPLICATION_MODE=slave
      - REDIS_MASTER_HOST=redis-master
      - REDIS_MASTER_PORT_NUMBER=6379
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - 6380:6379
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - redis-net
    restart: unless-stopped

  redis-replica-2:
    image: bitnami/redis:latest
    container_name: redis-replica-2
    hostname: redis-replica-2
    environment:
      - REDIS_REPLICATION_MODE=slave
      - REDIS_MASTER_HOST=redis-master
      - REDIS_MASTER_PORT_NUMBER=6379
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - 6381:6379
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - redis-net
    restart: unless-stopped

  sentinel-1:
    image: bitnami/redis-sentinel:latest
    container_name: sentinel-1
    hostname: sentinel-1
    ports:
      - 26379:26379
    environment:
      - REDIS_MASTER_SET=mymaster
      - REDIS_MASTER_HOST=redis-master
      - REDIS_MASTER_PORT_NUMBER=6379
      - REDIS_SENTINEL_QUORUM=2
      - REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS=5000
      - REDIS_SENTINEL_FAILOVER_TIMEOUT=30000
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    networks:
      - redis-net
    restart: unless-stopped

  sentinel-2:
    image: bitnami/redis-sentinel:latest
    container_name: sentinel-2
    hostname: sentinel-2
    ports:
      - 26380:26379
    environment:
      - REDIS_MASTER_SET=mymaster
      - REDIS_MASTER_HOST=redis-master
      - REDIS_MASTER_PORT_NUMBER=6379
      - REDIS_SENTINEL_QUORUM=2
      - REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS=5000
      - REDIS_SENTINEL_FAILOVER_TIMEOUT=30000
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    networks:
      - redis-net
    restart: unless-stopped

  sentinel-3:
    image: bitnami/redis-sentinel:latest
    container_name: sentinel-3
    hostname: sentinel-3
    ports:
      - 26381:26379
    environment:
      - REDIS_MASTER_SET=mymaster
      - REDIS_MASTER_HOST=redis-master
      - REDIS_MASTER_PORT_NUMBER=6379
      - REDIS_SENTINEL_QUORUM=2
      - REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS=5000
      - REDIS_SENTINEL_FAILOVER_TIMEOUT=30000
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
    networks:
      - redis-net
    restart: unless-stopped

  python_app:
    build: .
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      sentinel-1:
        condition: service_started
      sentinel-2:
        condition: service_started
      sentinel-3:
        condition: service_started
    tty: true
    stdin_open: true
    networks:
      - redis-net

networks:
  redis-net:
    name: redis-sentinel-net
    driver: bridge